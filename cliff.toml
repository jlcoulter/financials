# git-cliff configuration

[changelog]
# template for the changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# template for the changelog body
body = """
{% if not version %}
## [Unreleased]
{% else %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{%- if commit.breaking_change %} **BREAKING:** {{ commit.breaking_description }}{% endif %}
{% endfor %}
{% endfor %}
"""
# remove the leading/trailing whitespace
trim = true
# changelog footer
footer = """
"""

[git]
# parse commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# group commits by type
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^ci", group = "CI" },
    { message = "^build", group = "Build" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Chore" },
    { message = "^revert", group = "Revert" },
    { message = ".*", group = "Other" },
]
# exclude these commits from the changelog
filter_commits = false
# remove the prefix from the commit message, e.g. "feat: ..." -> "..."
strip_message = true
# include the scope in the commit message
scope = "classic"
