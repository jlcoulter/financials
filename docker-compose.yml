services:
  financials:
    image: ghcr.io/jlcoulter/financials
    ports:
      - "3000:3000"
    volumes:
      - data:/data
    environment:
      - DATABASE_URL=sqlite:///data/data.db
      - DB_PATH=/data/data.db
      - STATIC_DIR=/app/static
      - RUST_LOG=financials=debug
      # Uncomment to suppress the "failed to open browser" warning in headless environments:
      # - BROWSER=/bin/true
    restart: unless-stopped

volumes:
  data:
